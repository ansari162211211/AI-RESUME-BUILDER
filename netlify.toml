[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Firebase web client config is public by design (it ships in the browser
  # bundle and is protected by Firestore security rules), so exclude these
  # keys from Netlify's secrets scanning. All other secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_FIRESTORE_DATABASE_ID"
